<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigitalBank - Login</title>
<link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>DigitalBank</h1>

            <p class="subtitle">Secure Digital Banking</p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>
                </div>

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
